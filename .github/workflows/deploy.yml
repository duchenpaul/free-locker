name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'migrations/**'
      - 'config/**'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

concurrency:
  group: free-locker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: prod
    steps:
      - uses: actions/checkout@v5
      - name: Check environment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          IP_HASH_SALT: ${{ secrets.IP_HASH_SALT }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          RETENTION_HOURS: ${{ vars.RETENTION_HOURS }}
          MAX_DOWNLOADS: ${{ vars.MAX_DOWNLOADS }}
          MAX_MULTIPART_UPLOAD_BYTES: ${{ vars.MAX_MULTIPART_UPLOAD_BYTES }}
          MAX_SINGLE_UPLOAD_BYTES: ${{ vars.MAX_SINGLE_UPLOAD_BYTES }}
          FILE_LISTING_MODE: ${{ vars.FILE_LISTING_MODE }}
          RUNTIME_MODE: ${{ vars.RUNTIME_MODE }}
          GITHUB_ENVIRONMENT: prod
        run: bash deploy/check-environment-configuration.sh
      - uses: pnpm/action-setup@v5
        with:
          version: 11.1.3
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Deploy bootstrap Worker
        working-directory: apps/worker
        run: |
          pnpm exec wrangler deploy --config wrangler.bootstrap.jsonc \
            --var D1_DATABASE_NAME:${D1_DATABASE_NAME} \
            --var R2_BUCKET_NAME:${R2_BUCKET_NAME} \
            --var PUBLIC_BASE_URL:${PUBLIC_BASE_URL} \
            --var RETENTION_HOURS:${RETENTION_HOURS} \
            --var MAX_DOWNLOADS:${MAX_DOWNLOADS} \
            --var MAX_MULTIPART_UPLOAD_BYTES:${MAX_MULTIPART_UPLOAD_BYTES} \
            --var MAX_SINGLE_UPLOAD_BYTES:${MAX_SINGLE_UPLOAD_BYTES} \
            --var FILE_LISTING_MODE:${FILE_LISTING_MODE} \
            --var RUNTIME_MODE:${RUNTIME_MODE}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_NAME: free-locker
          R2_BUCKET_NAME: free-locker
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          RETENTION_HOURS: ${{ vars.RETENTION_HOURS }}
          MAX_DOWNLOADS: ${{ vars.MAX_DOWNLOADS }}
          # Optional limits; fallback values mirror config/transfer.defaults.json.
          MAX_MULTIPART_UPLOAD_BYTES: ${{ vars.MAX_MULTIPART_UPLOAD_BYTES || '10737418240' }}
          MAX_SINGLE_UPLOAD_BYTES: ${{ vars.MAX_SINGLE_UPLOAD_BYTES || '99614720' }}
          FILE_LISTING_MODE: ${{ vars.FILE_LISTING_MODE }}
          RUNTIME_MODE: ${{ vars.RUNTIME_MODE }}
      - name: Provision Worker resources
        id: resources
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER_NAME: free-locker
        run: bash deploy/provision-worker-resources.sh
      - name: Apply D1 migrations
        working-directory: apps/worker
        run: pnpm exec wrangler d1 migrations apply "${{ steps.resources.outputs.d1_database_name }}" --remote --config "${{ steps.resources.outputs.config_path }}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy Worker and static assets
        working-directory: apps/worker
        run: |
          pnpm exec wrangler deploy --config "${{ steps.resources.outputs.config_path }}" \
            --var D1_DATABASE_NAME:${D1_DATABASE_NAME} \
            --var D1_DATABASE_ID:${D1_DATABASE_ID} \
            --var R2_ACCOUNT_ID:${CLOUDFLARE_ACCOUNT_ID} \
            --var R2_BUCKET_NAME:${R2_BUCKET_NAME} \
            --var PUBLIC_BASE_URL:${PUBLIC_BASE_URL} \
            --var RETENTION_HOURS:${RETENTION_HOURS} \
            --var MAX_DOWNLOADS:${MAX_DOWNLOADS} \
            --var MAX_MULTIPART_UPLOAD_BYTES:${MAX_MULTIPART_UPLOAD_BYTES} \
            --var MAX_SINGLE_UPLOAD_BYTES:${MAX_SINGLE_UPLOAD_BYTES} \
            --var FILE_LISTING_MODE:${FILE_LISTING_MODE} \
            --var RUNTIME_MODE:${RUNTIME_MODE}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_NAME: ${{ steps.resources.outputs.d1_database_name }}
          D1_DATABASE_ID: ${{ steps.resources.outputs.d1_database_id }}
          R2_BUCKET_NAME: ${{ steps.resources.outputs.r2_bucket_name }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          RETENTION_HOURS: ${{ vars.RETENTION_HOURS }}
          MAX_DOWNLOADS: ${{ vars.MAX_DOWNLOADS }}
          # Optional limits; fallback values mirror config/transfer.defaults.json.
          MAX_MULTIPART_UPLOAD_BYTES: ${{ vars.MAX_MULTIPART_UPLOAD_BYTES || '10737418240' }}
          MAX_SINGLE_UPLOAD_BYTES: ${{ vars.MAX_SINGLE_UPLOAD_BYTES || '99614720' }}
          FILE_LISTING_MODE: ${{ vars.FILE_LISTING_MODE }}
          RUNTIME_MODE: ${{ vars.RUNTIME_MODE }}
      - name: Sync Worker secrets
        working-directory: apps/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          IP_HASH_SALT: ${{ secrets.IP_HASH_SALT }}
        run: |
          if [ -n "${ADMIN_TOKEN}" ]; then
            printf '%s' "${ADMIN_TOKEN}" | pnpm exec wrangler secret put ADMIN_TOKEN --config "${{ steps.resources.outputs.config_path }}"
          fi
          printf '%s' "${IP_HASH_SALT}" | pnpm exec wrangler secret put IP_HASH_SALT --config "${{ steps.resources.outputs.config_path }}"
      - name: Provision R2 multipart credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_BUCKET_NAME: ${{ steps.resources.outputs.r2_bucket_name }}
          WRANGLER_CONFIG_PATH: ${{ steps.resources.outputs.config_path }}
        run: bash deploy/provision-r2-multipart-credentials.sh
