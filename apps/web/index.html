<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A temporary, no-account file locker for browsers, terminals, and automation."
    />
    <script>
      (() => {
        try {
          const preference = localStorage.getItem('free-locker-theme') || 'system';
          const systemTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme =
            preference === 'system' ? systemTheme : preference;
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <title>free-locker | Bash Upload - upload files from command line</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
